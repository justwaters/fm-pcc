[project]
name = "fm-pcc"
version = "0.1.0"
description = "Chat with Apple's on-device or Cloud Pro Foundation Models from your terminal."
requires-python = ">=3.11"
dependencies = ["textual>=0.60"]

[project.scripts]
fm-pcc = "fm_pcc.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_pcc"]
